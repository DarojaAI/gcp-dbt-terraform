name: Pre-Commit Checks

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  pre-commit-validation:
    name: Pre-Commit Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.6

      - name: Initialize Terraform
        run: |
          terraform init -backend=false
          cd examples/basic && terraform init -backend=false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform validate
          cd examples/basic && terraform validate

      - name: Run terraform test
        env:
          # Plan-only tests don't call Google APIs, but provider v7 demands a token.
          GOOGLE_OAUTH_ACCESS_TOKEN: fake-token-for-plan-only
        run: terraform test -verbose

      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: Initialize TFLint
        run: tflint --init --config=.tflint.hcl

      - name: Run TFLint
        run: tflint --config=.tflint.hcl
